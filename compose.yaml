services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30

  server:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      CMS_DEV_SEED: ${CMS_DEV_SEED:-false}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-go-cms-start}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-go-cms-start-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30m}
      JWT_CLOCK_SKEW: ${JWT_CLOCK_SKEW:-30s}
      FILES_PUBLIC_ROOT: ${FILES_PUBLIC_ROOT:-var/files/public}
      FILES_PRIVATE_ROOT: ${FILES_PRIVATE_ROOT:-var/files/private}
      FILES_PRIVATE_SIGNING_KEY: ${FILES_PRIVATE_SIGNING_KEY}
      LOGGER_FILE_PATH: ${LOGGER_FILE_PATH:-var/log/cms.log}
      FILES_PUBLIC_BASE_URL: ${FILES_PUBLIC_BASE_URL:-http://localhost:${SERVER_PORT:-8080}}
      FILES_PRIVATE_BASE_URL: ${FILES_PRIVATE_BASE_URL:-http://localhost:${SERVER_PORT:-8080}}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - server_data:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
  server_data:
  kafka_data:
