services:
  postgres:
    image: postgres:18
    container_name: go-cms-start-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./backend
    image: go-cms-start-server:dev
    container_name: go-cms-start-server
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-go-cms-start}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-go-cms-start-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-48h}
      JWT_CLOCK_SKEW: ${JWT_CLOCK_SKEW:-30s}
      FILES_PUBLIC_ROOT: ${FILES_PUBLIC_ROOT:-var/files/public}
      FILES_PRIVATE_ROOT: ${FILES_PRIVATE_ROOT:-var/files/private}
      FILES_PRIVATE_SIGNING_KEY: ${FILES_PRIVATE_SIGNING_KEY}
      LOGGER_FILE_PATH: ${LOGGER_FILE_PATH:-var/log/cms.log}
      FILES_PUBLIC_BASE_URL: http://localhost:${SERVER_PORT:-8080}
      FILES_PRIVATE_BASE_URL: http://localhost:${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - server_data:/app/var
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
  server_data:
